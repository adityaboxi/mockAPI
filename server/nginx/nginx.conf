# Load Lua modules
env LOG_SERVER_URL;
env CONTAINER_NAME;

events {
    worker_connections 1024;
}

http {
    # ---------- Lua Package Path ----------
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    # ---------- OpenTelemetry: Timer Initialization ----------
    init_worker_by_lua_block {
        local log_buffer = require("log_buffer")
        log_buffer.init_timer()
    }

    # ---------- Your existing config ----------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=add_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=update_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=delete_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=create_project_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=delete_project_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=status_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ask_ai_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=version_data_limit:10m rate=60r/m;

    upstream mockapi_app {
        ip_hash;
        server mockapi-app:3000;
        server mockapi-app-2:3000;
    }

    server {
        listen 80;
        server_name _;

        # --------------- LOG EVERY REQUEST (via Lua) ----------
        log_by_lua_block {
            local log_buffer = require("log_buffer")
            local entry = {
                level = "INFO",
                message = string.format("%s %s %s -> %s",
                    ngx.var.remote_addr,
                    ngx.var.request_method,
                    ngx.var.uri,
                    ngx.var.status
                ),
                method = ngx.var.request_method,
                uri = ngx.var.uri,
                status = ngx.var.status,
                client_ip = ngx.var.remote_addr,
                request_time = tonumber(ngx.var.request_time),
                upstream_addr = ngx.var.upstream_addr,
            }
            log_buffer.log(entry)
        }

        # ---------- Your locations (unchanged) ----------
        location = /api/add-api {
            limit_req zone=add_api_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        location = /api/update-api {
            limit_req zone=update_api_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        location ~ ^/api/versions/delete/ {
            limit_req zone=delete_api_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }


        location = /api/create-project {
            limit_req zone=create_project_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        location = /api/deleteproject {
            limit_req zone=delete_project_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        location ~ ^/api/projects/[^/]+/status$ {
            limit_req zone=status_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        location = /api/ask-ai {
            limit_req zone=ask_ai_limit burst=5 nodelay;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        # ---------- Cached endpoint ----------
        location = /api/api-version-data {
            limit_req zone=version_data_limit burst=5 nodelay;
            proxy_cache api_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        # ---------- All other /api/ routes ----------
        location /api/ {
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain mockapi-app .mockapi.info;
        }

        # ---------- WebSocket (Socket.io) ----------
        location /socket.io/ {
            proxy_pass http://mockapi_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---------- Catch‑all ----------
        location / {
            proxy_pass http://mockapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}