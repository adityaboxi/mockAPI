# OpenResty Nginx Reverse Proxy Configuration
# High-concurrency tuning for 10,000+ requests/sec

worker_processes auto;
worker_rlimit_nofile 65535;

env LOG_SERVER_URL;
env CONTAINER_NAME;

events {
    worker_connections 20480;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ---------- Lua Package Paths ----------
    lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/openresty/site/lualib/?.so;;";

    # ---------- OpenTelemetry Telemetry Initialization ----------
    init_worker_by_lua_block {
        local log_buffer = require("log_buffer")
        log_buffer.init_timer()
    }

    # ---------- Performance Optimizations ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;

    client_body_buffer_size 128k;
    client_max_body_size 20M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # ---------- Gzip Compression ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain application/javascript text/css application/xml;

    # ---------- Proxy Cache ----------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

    # ---------- Rate Limiting Zones ----------
    limit_req_zone $binary_remote_addr zone=add_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=update_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=delete_api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=create_project_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=delete_project_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=status_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ask_ai_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=version_data_limit:10m rate=60r/m;

    # ---------- Upstream with Keepalive Connection Pooling ----------
    upstream mockapi_app {
        ip_hash;
        server mockapi-app:3000 max_fails=3 fail_timeout=10s;
        server mockapi-app-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        # --------------- LOG EVERY REQUEST (via Non-Blocking Lua) ----------
        log_by_lua_block {
            local log_buffer = require("log_buffer")
            local entry = {
                level = "INFO",
                message = string.format("%s %s %s -> %s",
                    ngx.var.remote_addr or "",
                    ngx.var.request_method or "",
                    ngx.var.uri or "",
                    ngx.var.status or ""
                ),
                method = ngx.var.request_method,
                uri = ngx.var.uri,
                status = tonumber(ngx.var.status) or 200,
                client_ip = ngx.var.remote_addr,
                request_time = tonumber(ngx.var.request_time) or 0,
                upstream_addr = ngx.var.upstream_addr,
            }
            log_buffer.log(entry)
        }

        # Common Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_domain mockapi-app .mockapi.info;

        # ---------- Locations ----------
        location = /api/add-api {
            limit_req zone=add_api_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location = /api/update-api {
            limit_req zone=update_api_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location ~ ^/api/versions/delete/ {
            limit_req zone=delete_api_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location = /api/create-project {
            limit_req zone=create_project_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location = /api/deleteproject {
            limit_req zone=delete_project_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location ~ ^/api/projects/[^/]+/status$ {
            limit_req zone=status_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        location = /api/ask-ai {
            limit_req zone=ask_ai_limit burst=20 nodelay;
            proxy_pass http://mockapi_app;
        }

        # ---------- Cached endpoint ----------
        location = /api/api-version-data {
            limit_req zone=version_data_limit burst=20 nodelay;
            proxy_cache api_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://mockapi_app;
        }

        # ---------- All other /api/ routes ----------
        location /api/ {
            proxy_pass http://mockapi_app;
        }

        # ---------- WebSocket (Socket.io) ----------
        location /socket.io/ {
            proxy_pass http://mockapi_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---------- Catch-all ----------
        location / {
            proxy_pass http://mockapi_app;
        }
    }
}