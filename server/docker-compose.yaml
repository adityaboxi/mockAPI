version: '3.8'

volumes:
  redis_data:

networks:
  backend:
    driver: bridge
  orch-net:
    external: true
  shared-net:
    external: true

services:
  redis-external:
    image: redis:7-alpine
    container_name: redis-external
    volumes:
      - redis_data:/data
    networks:
      - shared-net
    restart: unless-stopped

  app: &app-base
    build: ./server
    image: mockapi-server:latest
    container_name: mockapi-app
    env_file: .env
    environment:
      - CONTAINER_NAME=mockapi-app
      - NODE_ENV=production
      - PORT=3000
    networks:
      - backend
      - orch-net
      - shared-net
    depends_on:
      - redis-external
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app-2:
    <<: *app-base
    container_name: mockapi-app-2
    environment:
      - CONTAINER_NAME=mockapi-app-2
      - NODE_ENV=production
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bullmq-worker:
    build:
      context: ./bullmq-worker
      dockerfile: Dockerfile
    container_name: bullmq-worker
    env_file:
      - ./.env
    environment:
      - CONTAINER_NAME=bullmq-worker
    networks:
      - shared-net
    depends_on:
      - redis-external
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mockapi-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - app
      - app-2
    networks:
      - backend
      - orch-net
      - shared-net
    env_file:
      - .env
    environment:
      - CONTAINER_NAME=mockapi-nginx