services:
  # ======================== INTERNAL REDIS ========================
  redis-internal:
    image: redis:7-alpine
    container_name: redis-internal
    volumes:
      - redis_data:/data
    networks: [orch-net]
    restart: unless-stopped

  # ======================== PROJECT CONTAINER BUILDER ========================
  project-container-builder:
    build: ./project-container
    image: project-container:latest
    profiles: ["build-only"]
    command: echo "Image built"

  # ======================== WORKER SERVER ========================
  worker-server:
    build: ./worker-server
    container_name: worker-server
    env_file: .env
    environment:
      # These are intentionally left empty – they will be loaded from .env
      - REDIS_URL=${REDIS_URL}
      - INTERNAL_REDIS_URL=${INTERNAL_REDIS_URL}
      - DOCKER_NETWORK=${DOCKER_NETWORK}
      - PROJECT_IMAGE=${PROJECT_IMAGE}
      - MONGO_URI=${MONGO_URI}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ======================== OPENRESTY (API Gateway) ========================
  openresty:
    build: ./openresty
    container_name: openresty
    ports:
      - "8080:80"
    env_file: .env
    environment:
      - INTERNAL_REDIS_HOST=${INTERNAL_REDIS_HOST}
      - INTERNAL_REDIS_PORT=${INTERNAL_REDIS_PORT}
    networks: [orch-net]
    depends_on:
      - redis-internal
    restart: unless-stopped

volumes:
  redis_data:

networks:
  orch-net:
    external: true
  shared-net:
    external: true