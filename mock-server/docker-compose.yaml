services:
  # ======================== INTERNAL REDIS ========================
  redis-internal:
    image: redis:7-alpine
    container_name: redis-internal
    volumes:
      - redis_data:/data
    networks:
      - orch-net
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=redis-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ======================== PROJECT CONTAINER BUILDER ========================
  project-container-builder:
    build: ./project-container
    image: project-container:latest
    profiles:
      - build-only
    command: echo "Image built"
    # No need for CONTAINER_NAME or healthcheck – it's a build‑only service.

  # ======================== WORKER SERVER (Project containers) ========================
  worker-server:
    build: ./worker-server
    container_name: worker-server
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=worker-server
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-server-2:
    build: ./worker-server
    container_name: worker-server-2
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=worker-server-2
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================== WORKER HEALTH ========================
  worker-health:
    build:
      context: ./worker-health
      dockerfile: Dockerfile
    container_name: worker-health
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=worker-health
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================== OPENRESTY (API Gateway) ========================
  openresty:
    build: ./openresty
    container_name: openresty
    ports:
      - "8080:80"
    env_file: .env
    environment:
      - INTERNAL_REDIS_HOST=${INTERNAL_REDIS_HOST}
      - INTERNAL_REDIS_PORT=${INTERNAL_REDIS_PORT}
      - EXTERNAL_REDIS_HOST=${EXTERNAL_REDIS_HOST}
      - EXTERNAL_REDIS_PORT=${EXTERNAL_REDIS_PORT}
      - CONTAINER_NAME=openresty
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================== WORKER LOGS (BullMQ consumers) ========================
  worker-logs:
    build: ./worker-logs
    container_name: worker-logs
    env_file: .env
    networks:
      - orch-net
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-internal
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=worker-logs
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:

networks:
  orch-net:
    external: true
  shared-net:
    external: true