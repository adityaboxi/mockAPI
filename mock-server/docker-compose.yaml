services:
  # ======================== INTERNAL REDIS ========================
  redis-internal:
    image: redis:7-alpine
    container_name: redis-internal
    volumes:
      - redis_data:/data
    networks:
      - orch-net
    restart: unless-stopped

  # ======================== PROJECT CONTAINER BUILDER ========================
  project-container-builder:
    build: ./project-container
    image: project-container:latest
    profiles:
      - build-only
    command: echo "Image built"

  # ======================== WORKER SERVER (Project containers) ========================
  worker-server:
    build: ./worker-server
    container_name: worker-server
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-server-2:
    build: ./worker-server
    container_name: worker-server-2
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orch-net
      - shared-net
    depends_on:
      - redis-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ======================== OPENRESTY (API Gateway) ========================
  openresty:
    build: ./openresty
    container_name: openresty
    ports:
      - "8080:80"
    env_file: .env
    environment:
      - INTERNAL_REDIS_HOST=${INTERNAL_REDIS_HOST}
      - INTERNAL_REDIS_PORT=${INTERNAL_REDIS_PORT}
      - EXTERNAL_REDIS_HOST=${EXTERNAL_REDIS_HOST}
      - EXTERNAL_REDIS_PORT=${EXTERNAL_REDIS_PORT}
    networks:
      - orch-net
      - shared-net   # required to reach redis-external
    depends_on:
      - redis-internal
    restart: unless-stopped

  # ======================== WORKER LOGS (BullMQ consumers) ========================
  worker-logs:
    build: ./worker-logs
    container_name: worker-logs
    env_file: .env
    networks:
      - orch-net
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-internal
    restart: unless-stopped

volumes:
  redis_data:

networks:
  orch-net:
    external: true
  shared-net:
    external: true