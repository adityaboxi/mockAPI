name: Deploy Mock-Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu
            mkdir -p mockAPI
            cd mockAPI

            if [ ! -d "mock-server/.git" ]; then
              echo "📦 Cloning mock-server..."
              rm -rf mock-server
              git clone https://github.com/adityaboxi/mock-server.git mock-server
            fi

            echo "${{ secrets.MOCK_SERVER_ENV }}" > mock-server/.env

            cd mock-server
            git pull origin main
            docker-compose down
            docker-compose --profile build-only up -d --build

            echo "⏳ Waiting for mock-server health..."
            for i in {1..30}; do
              if curl -s -f http://localhost:8080/healthz > /dev/null; then
                echo "✅ Mock-server healthy"
                exit 0
              fi
              sleep 1
            done
            echo "❌ Mock-server health check failed"
            exit 1