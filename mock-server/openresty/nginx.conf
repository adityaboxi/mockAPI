worker_processes 1;
env INTERNAL_REDIS_HOST;
env INTERNAL_REDIS_PORT;
env EXTERNAL_REDIS_HOST;
env EXTERNAL_REDIS_PORT;

events { worker_connections 1024; }

http {
    resolver 127.0.0.11 ipv6=off;

    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Real-IP;
    real_ip_recursive  on;

    lua_shared_dict latency_store 10m;
    lua_shared_dict rate_limit   20m;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mock_cache:10m max_size=500m inactive=60m use_temp_path=off;

    server {
        listen 80;

        location ~ ^/p/(?<project_id>[^/]+)(?<rest>/.*)$ {
            set $backend '';

            access_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"

                local red = redis:new()
                red:set_timeout(1000)
                local host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                local port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                local ok, err = red:connect(host, port)
                if not ok then
                    ngx.status = 502
                    ngx.say("cannot reach internal redis: ", err)
                    return ngx.exit(502)
                end
                local data, err = red:hget("routes", ngx.var.project_id)
                red:set_keepalive(10000, 100)
                if not data or data == ngx.null then
                    ngx.status = 404
                    ngx.say("unknown project: ", ngx.var.project_id)
                    return ngx.exit(404)
                end
                local route = cjson.decode(data)
                if route.status ~= "running" then
                    ngx.status = 503
                    ngx.say("project not running (status=", route.status, ")")
                    return ngx.exit(503)
                end
                ngx.var.backend = route.containerName .. ":3000"

                local cookies = ngx.var.http_cookie
                local auth    = ngx.var.http_authorization
                local is_public = (cookies == nil or cookies == "") and
                                  (auth    == nil or auth    == "")

                local rl = ngx.shared.rate_limit
                local ip = ngx.var.remote_addr
                local now_sec = ngx.time()

                if is_public then
                    local ban_until = rl:get("pub_ban:" .. ip)
                    if ban_until then
                        local remaining = tonumber(ban_until) - now_sec
                        if remaining > 0 then
                            ngx.status = 429
                            ngx.header["Retry-After"] = remaining
                            ngx.say("Rate limit exceeded. Banned. Try again in " .. remaining .. " seconds.")
                            return ngx.exit(429)
                        else
                            rl:delete("pub_ban:" .. ip)
                        end
                    end

                    local window_key = "pub_rl:" .. ip .. ":" .. now_sec
                    local count, err = rl:incr(window_key, 1, 0, 2)
                    if not count then
                        ngx.log(ngx.ERR, "rate limit incr error: ", err)
                    elseif count > 100 then
                        local ban_time = now_sec + 600
                        rl:set("pub_ban:" .. ip, ban_time, 600)
                        rl:delete(window_key)
                        ngx.status = 429
                        ngx.header["Retry-After"] = 600
                        ngx.say("Rate limit exceeded. Banned for 10 minutes. Try again later.")
                        return ngx.exit(429)
                    end

                else
                    local ban_until = rl:get("priv_ban:" .. ip)
                    if ban_until then
                        local remaining = tonumber(ban_until) - now_sec
                        if remaining > 0 then
                            ngx.status = 429
                            ngx.header["Retry-After"] = remaining
                            ngx.say("Too many private requests. Banned. Try again in " .. remaining .. " seconds.")
                            return ngx.exit(429)
                        else
                            rl:delete("priv_ban:" .. ip)
                        end
                    end

                    local window_key = "priv_rl:" .. ip .. ":" .. now_sec
                    local count, err = rl:incr(window_key, 1, 0, 2)
                    if not count then
                        ngx.log(ngx.ERR, "priv rate limit incr error: ", err)
                    elseif count > 100 then
                        local ban_time = now_sec + 86400
                        rl:set("priv_ban:" .. ip, ban_time, 86400)
                        rl:delete(window_key)

                        local email_sent_key = "dos_email_sent:" .. ip
                        local already_sent = rl:get(email_sent_key)
                        if not already_sent then
                            local username = string.match(ngx.var.project_id, "^([^_]+)")
                            if username then
                                local function send_dos_alert(premature)
                                    if premature then return end
                                    local red2 = redis:new()
                                    red2:set_timeout(1000)
                                    local ok2, err2 = red2:connect(host, port)
                                    if not ok2 then return end

                                    local members_json, err = red2:get("project_members:" .. ngx.var.project_id)
                                    local members = {}
                                    if members_json and members_json ~= ngx.null then
                                        members = cjson.decode(members_json)
                                    end

                                    if #members == 0 then
                                        table.insert(members, username)
                                    end

                                    for _, member in ipairs(members) do
                                        local email, err3 = red2:get("user:" .. member .. ":email")
                                        if email and email ~= ngx.null then
                                            local job = cjson.encode({
                                                to = email,
                                                subject = "🔴 DoS Alert – " .. ngx.var.project_id,
                                                body  = "Your project " .. ngx.var.project_id ..
                                                        " received over 100 private requests/sec from IP " .. ip ..
                                                        ". The IP has been banned for 24 hours.\n\n" ..
                                                        "Request path: " .. ngx.var.rest ..
                                                        "\nTime: " .. os.date("%Y-%m-%d %H:%M:%S", ngx.time()) ..
                                                        "\n\nThis is an automated security notification.",
                                                project_id = ngx.var.project_id,
                                                ip = ip,
                                                timestamp = ngx.time(),
                                                path = ngx.var.rest,
                                                method = ngx.req.get_method(),
                                                is_private = true,
                                            })
                                            red2:lpush("bullmq:bullmq-email-jobs:wait", job)
                                        end
                                    end
                                    red2:set_keepalive(10000, 100)
                                end
                                local ok_timer, err_timer = ngx.timer.at(0, send_dos_alert)
                                if not ok_timer then
                                    ngx.log(ngx.WARN, "failed to create DoS email timer: ", err_timer)
                                end
                            end
                            rl:set(email_sent_key, "1", 600)
                        end

                        ngx.status = 429
                        ngx.header["Retry-After"] = 86400
                        ngx.say("DoS protection triggered. Banned for 24 hours. Owner and team have been notified.")
                        return ngx.exit(429)
                    end
                end
            }

            header_filter_by_lua_block {
                local key = ngx.var.scheme .. "://" .. ngx.var.host .. ngx.var.request_uri
                local store = ngx.shared.latency_store

                if ngx.var.upstream_cache_status == "MISS" then
                    local lat = ngx.header["X-Latency"]
                    if lat then
                        store:set(key, tonumber(lat))
                    end
                end

                if ngx.var.upstream_cache_status == "HIT" then
                    local lat = store:get(key)
                    if lat and lat > 0 then
                        ngx.sleep(lat / 1000)
                    end
                end
            }

            log_by_lua_block {
                local project_id = ngx.var.project_id
                local path       = ngx.var.rest
                local method     = ngx.req.get_method()
                local timestamp  = ngx.time()
                local cache      = ngx.var.upstream_cache_status
                local ip         = ngx.var.remote_addr
                local status     = ngx.status
                local latency_ms = (ngx.now() - ngx.req.start_time()) * 1000

                local cookies = ngx.var.http_cookie
                local auth    = ngx.var.http_authorization
                local is_private = not ((cookies == nil or cookies == "") and
                                        (auth    == nil or auth    == ""))

                local cjson = require "cjson"
                local redis = require "resty.redis"
                local red_internal = redis:new()
                red_internal:set_timeout(1000)
                local internal_host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                local internal_port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                local ok_internal, err_internal = red_internal:connect(internal_host, internal_port)

                local total_latency = latency_ms
                local team_latency = 0
                local user_latency = 0
                local ttl = 0

                if ok_internal then
                    local ttl_str, err = red_internal:get("ttl:" .. project_id)
                    if ttl_str and ttl_str ~= ngx.null then
                        ttl = tonumber(ttl_str) or 0
                    end

                    local team_latency_str, err = red_internal:get("team:latency:" .. project_id)
                    if team_latency_str and team_latency_str ~= ngx.null then
                        team_latency = tonumber(team_latency_str) or 0
                    end

                    local username = string.match(project_id, "^([^_]+)")
                    if username then
                        local user_latency_str, err = red_internal:get("user:latency:" .. project_id .. ":" .. username)
                        if user_latency_str and user_latency_str ~= ngx.null then
                            user_latency = tonumber(user_latency_str) or 0
                        end
                    end

                    total_latency = latency_ms + team_latency + user_latency

                    local log_entry = {
                        project_id   = project_id,
                        path         = path,
                        method       = method,
                        timestamp    = timestamp,
                        cache        = cache,
                        ip           = ip,
                        status       = status,
                        latency_ms   = latency_ms,
                        team_latency = team_latency,
                        user_latency = user_latency,
                        total_latency = total_latency,
                        private      = is_private,
                        ttl          = ttl,
                    }

                    local json = cjson.encode(log_entry)
                    red_internal:lpush("bullmq:bullmq-api-logs:wait", json)

                    if is_private then
                        red_internal:zadd("rtt:" .. project_id, timestamp, latency_ms)
                        red_internal:zremrangebyrank("rtt:" .. project_id, 0, -1001)
                    end
                    red_internal:set_keepalive(10000, 100)
                else
                    ngx.log(ngx.ERR, "Failed to connect to internal Redis: ", err_internal)
                end

                local red_external = redis:new()
                red_external:set_timeout(1000)
                local external_host = os.getenv("EXTERNAL_REDIS_HOST") or "redis-external"
                local external_port = tonumber(os.getenv("EXTERNAL_REDIS_PORT")) or 6379
                local ok_external, err_external = red_external:connect(external_host, external_port)

                if ok_external then
                    local live_payload = {
                        project_id = project_id,
                        path       = path,
                        method     = method,
                        timestamp  = timestamp,
                        latency_ms = total_latency,
                    }
                    local live_json = cjson.encode(live_payload)
                    red_external:publish("ws:new_api_log", live_json)
                    red_external:set_keepalive(10000, 100)
                else
                    ngx.log(ngx.ERR, "Failed to connect to external Redis: ", err_external)
                end
            }

            proxy_cache mock_cache;
            proxy_cache_key "$scheme$request_method$host$project_id$rest$is_args$args";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass http://$backend$rest$is_args$args;
        }

        location / {
            default_type text/plain;
            return 200 "orchestrator gateway ok\n";
        }
    }
}