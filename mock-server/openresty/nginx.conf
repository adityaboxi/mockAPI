worker_processes auto;
worker_rlimit_nofile 65535;

env INTERNAL_REDIS_HOST;
env INTERNAL_REDIS_PORT;
env EXTERNAL_REDIS_HOST;
env EXTERNAL_REDIS_PORT;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens      off;

    # DNS Resolver for Docker Swarm / Compose network
    resolver 127.0.0.11 ipv6=off;
    resolver_timeout 2s;

    # Lua Sockets & Connection Pools
    lua_socket_connect_timeout 200ms;
    lua_socket_read_timeout    1000ms;
    lua_socket_send_timeout    1000ms;
    lua_socket_pool_size       100;
    lua_socket_keepalive_timeout 60000;

    # Real Client IP Resolution
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Real-IP;
    real_ip_recursive  on;

    # High-Throughput In-Memory Caches
    lua_shared_dict route_cache   50m;
    lua_shared_dict rate_limit    100m;
    lua_shared_dict latency_store 50m;

    # Fast HTTP Proxy Caching
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mock_cache:50m max_size=1g inactive=60m use_temp_path=off;

    init_by_lua_block {
        os.execute("mkdir -p /var/log/nginx-logs")
    }

    server {
        listen 80 backlog=16384;

        location ~ ^/p/(?<project_id>[^/]+)(?<rest>/.*)$ {
            set $backend '';

            access_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                local cache = ngx.shared.route_cache

                local project_id = ngx.var.project_id
                local cache_key = "route:" .. project_id

                -- 1. Route Resolution (Cached in shared RAM, TTL=300s)
                local cached = cache:get(cache_key)
                if cached then
                    local route = cjson.decode(cached)
                    if route.status == "running" then
                        ngx.var.backend = route.containerName .. ":3000"
                    else
                        ngx.status = 503
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ error = "Project container not running", status = route.status }))
                        return ngx.exit(503)
                    end
                else
                    local red = redis:new()
                    red:set_timeout(200)
                    local host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                    local port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                    local ok, err = red:connect(host, port)
                    if not ok then
                        ngx.status = 502
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ error = "Gateway cannot reach internal route store", details = err }))
                        return ngx.exit(502)
                    end

                    local data, err = red:hget("routes", project_id)
                    red:set_keepalive(60000, 100)

                    if not data or data == ngx.null then
                        ngx.status = 404
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ error = "Unknown or unprovisioned project ID", project_id = project_id }))
                        return ngx.exit(404)
                    end

                    local route = cjson.decode(data)
                    if route.status ~= "running" then
                        ngx.status = 503
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ error = "Project container is paused or stopped", status = route.status }))
                        return ngx.exit(503)
                    end

                    cache:set(cache_key, data, 300)
                    ngx.var.backend = route.containerName .. ":3000"
                end

                -- 2. Sliding Window Rate Limiting (In-Memory Atomic Counters)
                local cookies = ngx.var.http_cookie
                local auth    = ngx.var.http_authorization
                local is_public = (cookies == nil or cookies == "") and (auth == nil or auth == "")

                local rl = ngx.shared.rate_limit
                local ip = ngx.var.remote_addr
                local now = ngx.time()

                local function sliding_window_check(prefix, limit, window_sec, ban_sec)
                    local ban_key = prefix .. "_ban:" .. ip
                    local ban_until = rl:get(ban_key)
                    if ban_until then
                        local remaining = tonumber(ban_until) - now
                        if remaining > 0 then
                            return false, remaining
                        else
                            rl:delete(ban_key)
                        end
                    end

                    local current_key = prefix .. "_rl:" .. ip .. ":" .. now
                    local current = rl:incr(current_key, 1, 0, window_sec + 2)
                    if not current then
                        return true, nil
                    end

                    local sum = 0
                    for i = 0, window_sec - 1 do
                        local val = rl:get(prefix .. "_rl:" .. ip .. ":" .. (now - i))
                        if val then sum = sum + val end
                    end

                    if sum > limit then
                        rl:set(ban_key, now + ban_sec, ban_sec)
                        return false, ban_sec
                    end
                    return true, nil
                end

                local allowed, ban_duration
                if is_public then
                    allowed, ban_duration = sliding_window_check("pub", 100, 1, 600)
                    if not allowed then
                        ngx.status = 429
                        ngx.header["Retry-After"] = ban_duration
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ error = "Public rate limit exceeded", retry_after_seconds = ban_duration }))
                        return ngx.exit(429)
                    end
                else
                    allowed, ban_duration = sliding_window_check("priv", 29, 1, 86400)
                    if not allowed then
                        local username = string.match(project_id, "^([^_]+)")
                        local job_data = {
                            project_id = project_id,
                            username   = username,
                            ip         = ip,
                            path       = ngx.var.rest,
                            method     = ngx.req.get_method(),
                            is_private = true,
                            timestamp  = ngx.time()
                        }
                        
                        local red2 = redis:new()
                        red2:set_timeout(200)
                        local host2 = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                        local port2 = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                        local ok2 = red2:connect(host2, port2)
                        if ok2 then
                            red2:lpush("bullmq:bullmq-email-jobs:wait", cjson.encode(job_data))
                            red2:set_keepalive(60000, 100)
                        end

                        ngx.status = 429
                        ngx.header["Retry-After"] = ban_duration
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say(cjson.encode({ 
                            error = "DoS protection triggered on private endpoint", 
                            retry_after_seconds = ban_duration,
                            message = "IP temporarily banned for 24 hours. Workspace administrator has been notified."
                        }))
                        return ngx.exit(429)
                    end
                end
            }

            # Proxying Direct to Dynamic Container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # HTTP Caching Strategy (Fast Gateway Cache for GET/HEAD mock requests)
            proxy_cache            mock_cache;
            proxy_cache_key        "$scheme$request_method$host$project_id$rest$is_args$args";
            proxy_cache_methods    GET HEAD;
            proxy_cache_valid      200 302 10m;
            proxy_cache_valid      404 1m;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock       on;
            proxy_ignore_headers   Set-Cookie;
            add_header             X-Cache-Status $upstream_cache_status always;
            more_set_headers       "X-Response-Time: $request_time";
            more_set_headers       "X-Gateway-Latency: $request_time";

            proxy_pass http://$backend$rest$is_args$args;
        }

        location / {
            default_type application/json;
            return 200 '{"status":"ok","service":"mockapi-gateway","version":"2.0"}\n';
        }
    }

    # ------------ NON-BLOCKING ASYNC LOG PIPELINE ----------
    log_by_lua_block {
        local log_data = {
            project_id   = ngx.var.project_id,
            path         = ngx.var.rest,
            method       = ngx.req.get_method(),
            timestamp    = ngx.time(),
            cache        = ngx.var.upstream_cache_status or "MISS",
            ip           = ngx.var.remote_addr,
            status       = ngx.status,
            latency_ms   = math.floor(((ngx.now() - ngx.req.start_time()) * 1000) + 0.5),
            private      = not (
                (ngx.var.http_cookie == nil or ngx.var.http_cookie == "") and
                (ngx.var.http_authorization == nil or ngx.var.http_authorization == "")
            )
        }

        if not log_data.project_id then return end

        local function process_log(premature)
            if premature then return end

            local cjson = require "cjson"
            local redis = require "resty.redis"

            -- 1. Internal Redis: Pipelined Ingestion
            local red_int = redis:new()
            red_int:set_timeout(200)
            local internal_host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
            local internal_port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
            local ok_int = red_int:connect(internal_host, internal_port)

            local total_latency = log_data.latency_ms
            local team_latency = 0
            local user_latency = 0
            local ttl = 0

            if ok_int then
                local project_id = log_data.project_id
                local username = string.match(project_id, "^([^_]+)") or ""

                -- High-Throughput Pipeline (1 TCP Packet)
                red_int:init_pipeline()
                red_int:get("ttl:" .. project_id)
                red_int:get("team:latency:" .. project_id)
                if username ~= "" then
                    red_int:get("user:latency:" .. project_id .. ":" .. username)
                end
                local results, err = red_int:commit_pipeline()

                if results and not err then
                    local ttl_val = results[1]
                    local team_val = results[2]
                    local user_val = username ~= "" and results[3] or nil

                    if ttl_val and ttl_val ~= ngx.null then ttl = tonumber(ttl_val) or 0 end
                    if team_val and team_val ~= ngx.null then team_latency = tonumber(team_val) or 0 end
                    if user_val and user_val ~= ngx.null then user_latency = tonumber(user_val) or 0 end
                end

                total_latency = log_data.latency_ms + team_latency + user_latency

                local full_entry = {
                    project_id    = log_data.project_id,
                    path          = log_data.path,
                    method        = log_data.method,
                    timestamp     = log_data.timestamp,
                    cache         = log_data.cache,
                    ip            = log_data.ip,
                    status        = log_data.status,
                    latency_ms    = log_data.latency_ms,
                    team_latency  = team_latency,
                    user_latency  = user_latency,
                    total_latency = total_latency,
                    private       = log_data.private,
                    ttl           = ttl
                }

                red_int:init_pipeline()
                red_int:lpush("bullmq:bullmq-api-logs:wait", cjson.encode(full_entry))
                if log_data.private then
                    red_int:zadd("rtt:" .. project_id, log_data.timestamp, log_data.latency_ms)
                    red_int:zremrangebyrank("rtt:" .. project_id, 0, -1001)
                end
                red_int:commit_pipeline()

                red_int:set_keepalive(60000, 100)
            end

            -- 2. External Redis: Real-time Live Latency Stream
            local red_ext = redis:new()
            red_ext:set_timeout(200)
            local external_host = os.getenv("EXTERNAL_REDIS_HOST") or "redis-external"
            local external_port = tonumber(os.getenv("EXTERNAL_REDIS_PORT")) or 6379
            local ok_ext = red_ext:connect(external_host, external_port)
            if ok_ext then
                local live_payload = {
                    project_id      = log_data.project_id,
                    projectId       = log_data.project_id,
                    path            = log_data.path,
                    method          = log_data.method,
                    status          = log_data.status,
                    statusCode      = log_data.status,
                    timestamp       = log_data.timestamp,
                    gateway_latency = log_data.latency_ms,
                    team_latency    = team_latency,
                    latency_ms      = total_latency,
                    latency         = total_latency,
                    total_latency   = total_latency,
                    cache           = log_data.cache,
                    ip              = log_data.ip,
                }
                red_ext:publish("ws:new_api_log", cjson.encode(live_payload))
                red_ext:set_keepalive(60000, 100)
            end
        end

        ngx.timer.at(0, process_log)
    }
}