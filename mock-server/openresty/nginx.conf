worker_processes 1;
env INTERNAL_REDIS_HOST;
env INTERNAL_REDIS_PORT;

events { worker_connections 1024; }

http {
    resolver 127.0.0.11 ipv6=off;

    # Shared dictionary to store latency values per API path
    lua_shared_dict latency_store 10m;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mock_cache:10m max_size=500m inactive=60m use_temp_path=off;

    server {
        listen 80;

        location ~ ^/p/(?<project_id>[^/]+)(?<rest>/.*)$ {
            set $backend '';

            # ---------- LUA: Fetch route from Redis ----------
            access_by_lua_block {
                local redis = require "resty.redis"
                local cjson = require "cjson"
                local red = redis:new()
                red:set_timeout(1000)

                local host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                local port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                local ok, err = red:connect(host, port)
                if not ok then
                    ngx.status = 502
                    ngx.say("cannot reach internal redis: ", err)
                    return ngx.exit(502)
                end

                local data, err = red:hget("routes", ngx.var.project_id)
                red:set_keepalive(10000, 100)

                if not data or data == ngx.null then
                    ngx.status = 404
                    ngx.say("unknown project: ", ngx.var.project_id)
                    return ngx.exit(404)
                end

                local route = cjson.decode(data)
                if route.status ~= "running" then
                    ngx.status = 503
                    ngx.say("project not running (status=", route.status, ")")
                    return ngx.exit(503)
                end

                ngx.var.backend = route.containerName .. ":3000"
            }

            # ================================================================
            # 🚀 LATENCY SIMULATION IN NGINX (Using Shared Dict + Lua)
            # ================================================================
            # Store and retrieve latency values from shared memory
            header_filter_by_lua_block {
                local key = ngx.var.scheme .. "://" .. ngx.var.host .. ngx.var.request_uri
                local store = ngx.shared.latency_store

                -- On MISS: Capture latency from backend header
                if ngx.var.upstream_cache_status == "MISS" then
                    local lat = ngx.header["X-Latency"]
                    if lat then
                        store:set(key, tonumber(lat))
                    end
                end

                -- On HIT: Apply latency delay before sending response
                if ngx.var.upstream_cache_status == "HIT" then
                    local lat = store:get(key)
                    if lat and lat > 0 then
                        -- Non-blocking sleep (event-driven)
                        ngx.sleep(lat / 1000)
                    end
                end
            }

            # Enable caching
            proxy_cache mock_cache;
            proxy_cache_key "$scheme$request_method$host$project_id$rest$is_args$args";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;
            add_header X-Cache-Status $upstream_cache_status always;

            # ---------- Proxy to dynamic backend ----------
            proxy_pass http://$backend$rest$is_args$args;
        }

        location / {
            default_type text/plain;
            return 200 "orchestrator gateway ok\n";
        }
    }
}