worker_processes 1;

env INTERNAL_REDIS_HOST;
env INTERNAL_REDIS_PORT;
env EXTERNAL_REDIS_HOST;
env EXTERNAL_REDIS_PORT;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    resolver_timeout 1s;

    lua_socket_connect_timeout 200ms;
    lua_socket_pool_size 50;

    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Real-IP;
    real_ip_recursive  on;

    lua_shared_dict route_cache   10m;
    lua_shared_dict rate_limit    20m;
    lua_shared_dict latency_store 10m;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mock_cache:10m max_size=500m inactive=60m use_temp_path=off;

    init_by_lua_block {
        os.execute("mkdir -p /var/log/nginx-logs")
    }

    server {
        listen 80;

        location ~ ^/p/(?<project_id>[^/]+)(?<rest>/.*)$ {
            set $backend '';

            access_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                local cache = ngx.shared.route_cache

                local project_id = ngx.var.project_id
                local cache_key = "route:" .. project_id

                -- Route resolution (cached, TTL=300s)
                local cached = cache:get(cache_key)
                if cached then
                    local route = cjson.decode(cached)
                    if route.status == "running" then
                        ngx.var.backend = route.containerName .. ":3000"
                    else
                        ngx.status = 503
                        ngx.say("project not running (status=", route.status, ")")
                        return ngx.exit(503)
                    end
                else
                    local red = redis:new()
                    red:set_timeout(200)
                    local host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                    local port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                    local ok, err = red:connect(host, port)
                    if not ok then
                        ngx.status = 502
                        ngx.say("cannot reach internal redis: ", err)
                        return ngx.exit(502)
                    end

                    local data, err = red:hget("routes", project_id)
                    red:set_keepalive(10000, 100)

                    if not data or data == ngx.null then
                        ngx.status = 404
                        ngx.say("unknown project: ", project_id)
                        return ngx.exit(404)
                    end

                    local route = cjson.decode(data)
                    if route.status ~= "running" then
                        ngx.status = 503
                        ngx.say("project not running (status=", route.status, ")")
                        return ngx.exit(503)
                    end

                    cache:set(cache_key, data, 300)
                    ngx.var.backend = route.containerName .. ":3000"
                end

                -- ---------- Rate limiting (sliding window) ----------
                local cookies = ngx.var.http_cookie
                local auth    = ngx.var.http_authorization
                local is_public = (cookies == nil or cookies == "") and
                                  (auth    == nil or auth    == "")

                local rl = ngx.shared.rate_limit
                local ip = ngx.var.remote_addr
                local now = ngx.time()

                local function sliding_window_check(prefix, limit, window_sec, ban_sec)
                    local ban_key = prefix .. "_ban:" .. ip
                    local ban_until = rl:get(ban_key)
                    if ban_until then
                        local remaining = tonumber(ban_until) - now
                        if remaining > 0 then
                            return false, remaining
                        else
                            rl:delete(ban_key)
                        end
                    end

                    local window_start = now - window_sec + 1
                    local keys = {}
                    for i = 0, window_sec-1 do
                        keys[#keys+1] = prefix .. "_rl:" .. ip .. ":" .. (window_start + i)
                    end

                    local sum = 0
                    for _, key in ipairs(keys) do
                        local val = rl:get(key)
                        if val then sum = sum + val end
                    end

                    local current_key = prefix .. "_rl:" .. ip .. ":" .. now
                    local current = rl:incr(current_key, 1, 0, window_sec + 1)
                    if not current then
                        ngx.log(ngx.ERR, "rate limit incr error")
                        return true, nil
                    end
                    sum = sum + 1

                    if sum > limit then
                        rl:set(ban_key, now + ban_sec, ban_sec)
                        for _, key in ipairs(keys) do rl:delete(key) end
                        rl:delete(current_key)
                        return false, ban_sec
                    end
                    return true, nil
                end

                local allowed, ban_duration
                if is_public then
                    allowed, ban_duration = sliding_window_check("pub", 100, 1, 600)
                    if not allowed then
                        ngx.status = 429
                        ngx.header["Retry-After"] = ban_duration
                        ngx.say("Rate limit exceeded. Banned for " .. ban_duration .. " seconds.")
                        return ngx.exit(429)
                    end
                else
                    allowed, ban_duration = sliding_window_check("priv", 29, 1, 86400)
                    if not allowed then
                        -- Push DoS alert to BullMQ email queue (raw JSON)
                        local username = string.match(project_id, "^([^_]+)")
                        local job_data = {
                            project_id = project_id,
                            username   = username,
                            ip         = ip,
                            path       = ngx.var.rest,
                            method     = ngx.req.get_method(),
                            is_private = true,
                            timestamp  = ngx.time()
                        }
                        local red2 = redis:new()
                        red2:set_timeout(200)
                        local host2 = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
                        local port2 = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
                        local ok2, err2 = red2:connect(host2, port2)
                        if ok2 then
                            red2:lpush("bullmq:bullmq-email-jobs:wait", cjson.encode(job_data))
                            red2:set_keepalive(10000, 100)
                            ngx.log(ngx.INFO, "DoS alert queued for project ", project_id)
                        else
                            ngx.log(ngx.ERR, "Failed to queue DoS alert: ", err2)
                        end

                        ngx.status = 429
                        ngx.header["Retry-After"] = ban_duration
                        ngx.say("DoS protection triggered. Banned for 24 hours. Owner and team have been notified.")
                        return ngx.exit(429)
                    end
                end
            }

            # ---------- PROXY ----------
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;

            proxy_buffering off;

            proxy_cache            mock_cache;
            proxy_cache_key        "$scheme$request_method$host$project_id$rest$is_args$args";
            proxy_cache_methods    GET HEAD;
            proxy_cache_valid      200 302 1m;
            proxy_cache_valid      404 10s;
            add_header             X-Cache-Status $upstream_cache_status always;

            proxy_pass http://$backend$rest$is_args$args;
        }

        location / {
            default_type text/plain;
            return 200 "orchestrator gateway ok\n";
        }
    }

    # ---------- LOG (deferred to timer) ----------
    log_by_lua_block {
        local log_data = {
            project_id   = ngx.var.project_id,
            path         = ngx.var.rest,
            method       = ngx.req.get_method(),
            timestamp    = ngx.time(),
            cache        = ngx.var.upstream_cache_status,
            ip           = ngx.var.remote_addr,
            status       = ngx.status,
            latency_ms   = (ngx.now() - ngx.req.start_time()) * 1000,
            private      = not (
                (ngx.var.http_cookie == nil or ngx.var.http_cookie == "") and
                (ngx.var.http_authorization == nil or ngx.var.http_authorization == "")
            )
        }

        local function process_log(premature)
            if premature then return end

            local cjson = require "cjson"
            local redis = require "resty.redis"

            local red_int = redis:new()
            red_int:set_timeout(200)
            local internal_host = os.getenv("INTERNAL_REDIS_HOST") or "redis-internal"
            local internal_port = tonumber(os.getenv("INTERNAL_REDIS_PORT")) or 6379
            local ok_int, err_int = red_int:connect(internal_host, internal_port)

            local total_latency = log_data.latency_ms
            local team_latency = 0
            local user_latency = 0
            local ttl = 0

            if ok_int then
                local project_id = log_data.project_id
                local ttl_str = red_int:get("ttl:" .. project_id)
                if ttl_str and ttl_str ~= ngx.null then
                    ttl = tonumber(ttl_str) or 0
                end
                local team_latency_str = red_int:get("team:latency:" .. project_id)
                if team_latency_str and team_latency_str ~= ngx.null then
                    team_latency = tonumber(team_latency_str) or 0
                end
                local username = string.match(project_id, "^([^_]+)")
                if username then
                    local user_latency_str = red_int:get("user:latency:" .. project_id .. ":" .. username)
                    if user_latency_str and user_latency_str ~= ngx.null then
                        user_latency = tonumber(user_latency_str) or 0
                    end
                end
                total_latency = log_data.latency_ms + team_latency + user_latency

                local full_entry = {
                    project_id   = log_data.project_id,
                    path         = log_data.path,
                    method       = log_data.method,
                    timestamp    = log_data.timestamp,
                    cache        = log_data.cache,
                    ip           = log_data.ip,
                    status       = log_data.status,
                    latency_ms   = log_data.latency_ms,
                    team_latency = team_latency,
                    user_latency = user_latency,
                    total_latency = total_latency,
                    private      = log_data.private,
                    ttl          = ttl
                }

                local json = cjson.encode(full_entry)
                red_int:lpush("bullmq:bullmq-api-logs:wait", json)

                if log_data.private then
                    red_int:zadd("rtt:" .. project_id, log_data.timestamp, log_data.latency_ms)
                    red_int:zremrangebyrank("rtt:" .. project_id, 0, -1001)
                end

                red_int:set_keepalive(10000, 100)
            else
                local log_file = io.open("/var/log/nginx-logs/api-logs.log", "a")
                if log_file then
                    local simple_entry = {
                        project_id = log_data.project_id,
                        path = log_data.path,
                        method = log_data.method,
                        timestamp = log_data.timestamp,
                        cache = log_data.cache,
                        ip = log_data.ip,
                        status = log_data.status,
                        latency_ms = log_data.latency_ms,
                        private = log_data.private
                    }
                    log_file:write(cjson.encode(simple_entry) .. "\n")
                    log_file:close()
                else
                    ngx.log(ngx.ERR, "Failed to write log fallback file")
                end
            end

            local red_ext = redis:new()
            red_ext:set_timeout(200)
            local external_host = os.getenv("EXTERNAL_REDIS_HOST") or "redis-external"
            local external_port = tonumber(os.getenv("EXTERNAL_REDIS_PORT")) or 6379
            local ok_ext, err_ext = red_ext:connect(external_host, external_port)
            if ok_ext then
                local live_payload = {
                    project_id = log_data.project_id,
                    path       = log_data.path,
                    method     = log_data.method,
                    timestamp  = log_data.timestamp,
                    latency_ms = total_latency,
                }
                red_ext:publish("ws:new_api_log", cjson.encode(live_payload))
                red_ext:set_keepalive(10000, 100)
            else
                ngx.log(ngx.ERR, "Failed to connect to external Redis: ", err_ext)
            end
        end

        ngx.timer.at(0, process_log)
    }
}


