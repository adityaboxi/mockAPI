name: Deploy Changed Services

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu

            # Clone monorepo if missing (fresh clone detection)
            CLONED=false
            if [ ! -d "mockAPI/.git" ]; then
              echo "📦 Cloning mockAPI repository..."
              rm -rf mockAPI
              git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adityaboxi/mockAPI.git mockAPI
              CLONED=true
            fi

            cd mockAPI

            # ---- Force a clean state (restore deleted files, discard local changes) ----
            git fetch origin main
            git reset --hard FETCH_HEAD

            # ---------- Write .env files from secrets ----------
            echo "${{ secrets.SERVER_ENV }}" > server/.env
            echo "${{ secrets.CLIENT_ENV }}" > client/.env
            echo "${{ secrets.MOCK_SERVER_ENV }}" > mock-server/.env

            # --- Telemetry .env (ensure folder exists) ---
            mkdir -p telemetry-server
            if [ -n "${{ secrets.TELEMETRY_ENV }}" ]; then
              echo "${{ secrets.TELEMETRY_ENV }}" > telemetry-server/.env
            else
              printf "PORT=3003\nSESSION_SECRET=your-strong-secret\nREDIS_URL=redis://redis:6379\nDASHBOARD_USER=admin\nDASHBOARD_PASS=password\nCLIENT_ORIGIN=https://opentelemetry.client.mockapi.info\nNODE_ENV=production\nVITE_API_BASE_URL=/api\nVITE_WS_URL=/api\n" > telemetry-server/.env
            fi

            # ---------- Determine what to deploy ----------
            DEPLOY_SERVER=false
            DEPLOY_MOCK=false
            DEPLOY_CLIENT=false
            DEPLOY_DOMAIN=false
            DEPLOY_TELEMETRY=false

            folder_exists() {
              [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]
            }

            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$CLONED" == "true" ]; then
              echo "🔄 Manual trigger or fresh clone - deploying existing services"
              folder_exists "telemetry-server" && DEPLOY_TELEMETRY=true
              folder_exists "server" && DEPLOY_SERVER=true
              folder_exists "mock-server" && DEPLOY_MOCK=true
              folder_exists "client" && DEPLOY_CLIENT=true
              folder_exists "domainservice" && DEPLOY_DOMAIN=true
            else
              if [ -z "$(git rev-parse HEAD^)" ]; then
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              else
                CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
              fi

              echo "Changed files: $CHANGED_FILES"

              if folder_exists "telemetry-server" && echo "$CHANGED_FILES" | grep -q "^telemetry-server/"; then
                DEPLOY_TELEMETRY=true
              fi
              if folder_exists "server" && echo "$CHANGED_FILES" | grep -q "^server/"; then
                DEPLOY_SERVER=true
              fi
              if folder_exists "mock-server" && echo "$CHANGED_FILES" | grep -q "^mock-server/"; then
                DEPLOY_MOCK=true
              fi
              if folder_exists "client" && echo "$CHANGED_FILES" | grep -q "^client/"; then
                DEPLOY_CLIENT=true
              fi
              if folder_exists "domainservice" && echo "$CHANGED_FILES" | grep -q "^domainservice/"; then
                DEPLOY_DOMAIN=true
              fi

              if [ "$DEPLOY_SERVER" = false ] && [ "$DEPLOY_MOCK" = false ] && [ "$DEPLOY_CLIENT" = false ] && [ "$DEPLOY_DOMAIN" = false ] && [ "$DEPLOY_TELEMETRY" = false ]; then
                echo "ℹ️ No service folder changed - skipping deployment."
                exit 0
              fi
            fi

            export DEPLOY_SERVER DEPLOY_MOCK DEPLOY_CLIENT DEPLOY_DOMAIN DEPLOY_TELEMETRY

            # Make deploy.sh executable and run it with retry logic (up to 3 attempts)
            chmod +x deploy.sh
            echo "⏳ Starting deployment with retry logic..."
            for attempt in 1 2 3; do
              echo "🔄 Deployment attempt $attempt"
              if ./deploy.sh; then
                echo "✅ Deployment succeeded on attempt $attempt"
                break
              else
                echo "⚠️ Deployment attempt $attempt failed."
                if [ $attempt -eq 3 ]; then
                  echo "❌ All 3 deployment attempts failed. Exiting."
                  exit 1
                fi
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            done

            # ---------- Self-Healing Health Checks (non-fatal) ----------
            echo "⏳ Running post-deployment health checks and auto-recovery (non-fatal)..."

            # Helper: check a service and restart if unhealthy - always returns 0
            check_and_restart() {
              local container_name=$1
              local health_url=$2
              local max_attempts=3
              local attempt=0

              echo "🔍 Checking $container_name ..."
              while [ $attempt -lt $max_attempts ]; do
                if curl -s -f "$health_url" > /dev/null; then
                  echo "✅ $container_name is healthy"
                  return 0
                fi
                attempt=$((attempt+1))
                echo "⏳ $container_name not ready (attempt $attempt/$max_attempts) - waiting 5s..."
                sleep 5
              done

              echo "⚠️ $container_name is unhealthy - restarting..."
              docker restart "$container_name" || true
              sleep 10
              if curl -s -f "$health_url" > /dev/null; then
                echo "✅ $container_name recovered after restart"
              else
                echo "❌ $container_name still unhealthy after restart - continuing anyway"
              fi
              return 0  # Always return 0 to avoid breaking the script
            }

            # Check telemetry server (only if deployed) - critical, but still non-fatal
            if [ "$DEPLOY_TELEMETRY" = "true" ]; then
              check_and_restart "telemetry-server" "http://localhost:3003/health"
            fi

            # Check domain service (only if deployed) - critical, but non-fatal
            if [ "$DEPLOY_DOMAIN" = "true" ]; then
              echo "🔍 Checking domain-proxy..."
              if docker exec domain-proxy nginx -t 2>/dev/null; then
                echo "✅ domain-proxy nginx config is valid"
              else
                echo "⚠️ domain-proxy nginx config invalid - restarting..."
                docker restart domain-proxy
                sleep 5
                if docker exec domain-proxy nginx -t 2>/dev/null; then
                  echo "✅ domain-proxy recovered after restart"
                else
                  echo "❌ domain-proxy still unhealthy -continuing anyway"
                fi
              fi
            fi

            # Check server (port 8081) if deployed
            if [ "$DEPLOY_SERVER" = "true" ]; then
              check_and_restart "mockapi-app" "http://localhost:8081/"
            fi

            # Check mock-server (port 8080) if deployed
            if [ "$DEPLOY_MOCK" = "true" ]; then
              check_and_restart "mock-server" "http://localhost:8080/healthz"
            fi

            # Check client (port 8082) if deployed
            if [ "$DEPLOY_CLIENT" = "true" ]; then
              check_and_restart "client" "http://localhost:8082/"
            fi

            echo "✅ Deployment complete - health checks completed (some may have warnings)."