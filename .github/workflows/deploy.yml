name: Deploy Changed Services

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            set -o pipefail
            cd /home/ubuntu

            # -----------------------------------------------------------
            # 1. CLONE / UPDATE REPOSITORY
            # -----------------------------------------------------------
            CLONED=false
            if [ ! -d "mockAPI/.git" ]; then
              echo "📦 Cloning mockAPI repository..."
              rm -rf mockAPI
              git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adityaboxi/mockAPI.git mockAPI
              CLONED=true
            fi

            cd mockAPI
            git fetch origin main
            git reset --hard FETCH_HEAD

            # -----------------------------------------------------------
            # 2. WRITE .env FILES FROM SECRETS
            # -----------------------------------------------------------
            echo "${{ secrets.SERVER_ENV }}" > server/.env
            echo "${{ secrets.CLIENT_ENV }}" > client/.env
            echo "${{ secrets.MOCK_SERVER_ENV }}" > mock-server/.env

            mkdir -p telemetry-server
            if [ -n "${{ secrets.TELEMETRY_ENV }}" ]; then
              echo "${{ secrets.TELEMETRY_ENV }}" > telemetry-server/.env
            else
              # Production defaults – adjust as needed
              printf "PORT=3003\nSESSION_SECRET=your-strong-secret\nREDIS_URL=redis://redis:6379\nDASHBOARD_USER=admin\nDASHBOARD_PASS=password\nCLIENT_ORIGIN=https://opentelemetry.client.mockapi.info\nNODE_ENV=production\nVITE_API_BASE_URL=/api\nVITE_WS_URL=/api\n" > telemetry-server/.env
            fi

            # -----------------------------------------------------------
            # 3. DETERMINE DEPLOYMENT FLAGS
            # -----------------------------------------------------------
            DEPLOY_SERVER=false
            DEPLOY_MOCK=false
            DEPLOY_CLIENT=false
            DEPLOY_DOMAIN=false
            DEPLOY_TELEMETRY=false

            folder_exists() {
              [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]
            }

            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$CLONED" == "true" ]; then
              echo "🔄 Manual trigger or fresh clone - deploying all existing services"
              folder_exists "telemetry-server" && DEPLOY_TELEMETRY=true
              folder_exists "server" && DEPLOY_SERVER=true
              folder_exists "mock-server" && DEPLOY_MOCK=true
              folder_exists "client" && DEPLOY_CLIENT=true
              folder_exists "domainservice" && DEPLOY_DOMAIN=true
            else
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
              else
                CHANGED_FILES=$(git diff --name-only --diff-filter=A HEAD)
              fi
              echo "Changed files: $CHANGED_FILES"

              if folder_exists "telemetry-server" && echo "$CHANGED_FILES" | grep -q "^telemetry-server/"; then
                DEPLOY_TELEMETRY=true
              fi
              if folder_exists "server" && echo "$CHANGED_FILES" | grep -q "^server/"; then
                DEPLOY_SERVER=true
              fi
              if folder_exists "mock-server" && echo "$CHANGED_FILES" | grep -q "^mock-server/"; then
                DEPLOY_MOCK=true
              fi
              if folder_exists "client" && echo "$CHANGED_FILES" | grep -q "^client/"; then
                DEPLOY_CLIENT=true
              fi
              if folder_exists "domainservice" && echo "$CHANGED_FILES" | grep -q "^domainservice/"; then
                DEPLOY_DOMAIN=true
              fi
            fi

            if [ "$DEPLOY_SERVER" = false ] && [ "$DEPLOY_MOCK" = false ] && [ "$DEPLOY_CLIENT" = false ] && [ "$DEPLOY_DOMAIN" = false ] && [ "$DEPLOY_TELEMETRY" = false ]; then
              echo "ℹ️ No service folder changed - skipping deployment."
              exit 0
            fi

            export DEPLOY_SERVER DEPLOY_MOCK DEPLOY_CLIENT DEPLOY_DOMAIN DEPLOY_TELEMETRY

            # -----------------------------------------------------------
            # 4. ENSURE NETWORKS EXIST
            # -----------------------------------------------------------
            docker network create orch-net 2>/dev/null || true
            docker network create shared-net 2>/dev/null || true

            # -----------------------------------------------------------
            # 5. RUN DEPLOY.SH (BUILD → START → HEALTH CHECKS)
            # -----------------------------------------------------------
            chmod +x deploy.sh
            echo "🚀 Running deploy.sh – this will build, start, and health-check all services."
            ./deploy.sh   # If this fails, the workflow stops here (set -e is on)

            echo "✅ Deployment and health checks passed."