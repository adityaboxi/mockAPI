name: Deploy Changed Services

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu

            # Clone monorepo if missing (fresh clone detection)
            CLONED=false
            if [ ! -d "mockAPI/.git" ]; then
              echo "📦 Cloning mockAPI repository..."
              rm -rf mockAPI
              git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adityaboxi/mockAPI.git mockAPI
              CLONED=true
            fi

            cd mockAPI

            # ---- Force a clean state (restore deleted files, discard local changes) ----
            git fetch origin main
            git reset --hard FETCH_HEAD

            # ---------- Write .env files from secrets (always overwrite) ----------
            echo "${{ secrets.SERVER_ENV }}" > server/.env
            echo "${{ secrets.CLIENT_ENV }}" > client/.env
            echo "${{ secrets.MOCK_SERVER_ENV }}" > mock-server/.env

            # --- Telemetry .env (fallback if secret not set) ---
            if [ -n "${{ secrets.TELEMETRY_ENV }}" ]; then
              echo "${{ secrets.TELEMETRY_ENV }}" > telemetry-server/.env
            else
              mkdir -p telemetry-server
              echo "NODE_ENV=production" > telemetry-server/.env
              echo "PORT=3003" >> telemetry-server/.env
              echo "DASHBOARD_USER=myusername" >> telemetry-server/.env
              echo "DASHBOARD_PASS=mypassword" >> telemetry-server/.env
              echo "SESSION_SECRET=some-strong-random-string" >> telemetry-server/.env
            fi

            # ---------- Determine what to deploy ----------
            DEPLOY_SERVER=false
            DEPLOY_MOCK=false
            DEPLOY_CLIENT=false
            DEPLOY_DOMAIN=false
            DEPLOY_TELEMETRY=false

            # Helper function to check if folder exists and has content
            folder_exists() {
              [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]
            }

            # If manual trigger or fresh clone – deploy ALL services (if folders exist)
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$CLONED" == "true" ]; then
              echo "🔄 Manual trigger or fresh clone – deploying existing services"
              folder_exists "telemetry-server" && DEPLOY_TELEMETRY=true
              folder_exists "server" && DEPLOY_SERVER=true
              folder_exists "mock-server" && DEPLOY_MOCK=true
              folder_exists "client" && DEPLOY_CLIENT=true
              folder_exists "domainservice" && DEPLOY_DOMAIN=true
            else
              # Detect changed folders (for normal push)
              if [ -z "$(git rev-parse HEAD^)" ]; then
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              else
                CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
              fi

              echo "Changed files: $CHANGED_FILES"

              # Only set deploy flags if folder exists and files changed inside it
              if folder_exists "telemetry-server" && echo "$CHANGED_FILES" | grep -q "^telemetry-server/"; then
                DEPLOY_TELEMETRY=true
              fi
              if folder_exists "server" && echo "$CHANGED_FILES" | grep -q "^server/"; then
                DEPLOY_SERVER=true
              fi
              if folder_exists "mock-server" && echo "$CHANGED_FILES" | grep -q "^mock-server/"; then
                DEPLOY_MOCK=true
              fi
              if folder_exists "client" && echo "$CHANGED_FILES" | grep -q "^client/"; then
                DEPLOY_CLIENT=true
              fi
              if folder_exists "domainservice" && echo "$CHANGED_FILES" | grep -q "^domainservice/"; then
                DEPLOY_DOMAIN=true
              fi

              # If no service folder changed, skip deployment
              if [ "$DEPLOY_SERVER" = false ] && [ "$DEPLOY_MOCK" = false ] && [ "$DEPLOY_CLIENT" = false ] && [ "$DEPLOY_DOMAIN" = false ] && [ "$DEPLOY_TELEMETRY" = false ]; then
                echo "ℹ️ No service folder changed – skipping deployment."
                exit 0
              fi
            fi

            export DEPLOY_SERVER DEPLOY_MOCK DEPLOY_CLIENT DEPLOY_DOMAIN DEPLOY_TELEMETRY

            # Make deploy.sh executable and run it
            chmod +x deploy.sh
            ./deploy.sh

            # ---------- Health Checks (only for deployed services) ----------
            echo "⏳ Verifying deployed services..."

            # Health check for telemetry (container running)
            if [ "$DEPLOY_TELEMETRY" = "true" ]; then
              echo "🔍 Checking telemetry-server container status..."
              for i in {1..30}; do
                if docker ps --filter "name=telemetry-server" --filter "status=running" | grep -q telemetry-server; then
                  echo "✅ Telemetry server container is running"
                  break
                fi
                sleep 1
              done
            fi

            if [ "$DEPLOY_SERVER" = "true" ] || [ "$DEPLOY_MOCK" = "true" ]; then
              # Health check for server (port 8081)
              if [ "$DEPLOY_SERVER" = "true" ]; then
                for i in {1..30}; do
                  if curl -s -f http://localhost:8081/ > /dev/null; then
                    echo "✅ Server healthy"
                    break
                  fi
                  sleep 1
                done
              fi
              # Health check for mock-server (port 8080)
              if [ "$DEPLOY_MOCK" = "true" ]; then
                for i in {1..30}; do
                  if curl -s -f http://localhost:8080/healthz > /dev/null; then
                    echo "✅ Mock-server healthy"
                    break
                  fi
                  sleep 1
                done
              fi
            fi

            if [ "$DEPLOY_CLIENT" = "true" ]; then
              for i in {1..30}; do
                if curl -s -f http://localhost:8082/ > /dev/null; then
                  echo "✅ Client healthy"
                  break
                fi
                sleep 1
              done
            fi

            if [ "$DEPLOY_DOMAIN" = "true" ]; then
              echo "🔍 Checking domain-proxy container status..."
              for i in {1..30}; do
                # Check if container is running and responds with 200 or 301 (redirect)
                if docker ps --filter "name=domain-proxy" --filter "status=running" | grep -q domain-proxy; then
                  # Also check HTTP response (allow 200 or 301)
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
                  if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
                    echo "✅ Domain service healthy (HTTP $STATUS)"
                    break
                  else
                    echo "⏳ Domain service responding with $STATUS, waiting..."
                  fi
                else
                  echo "⏳ Domain service container not running yet..."
                fi
                sleep 1
              done
            fi

            echo "✅ Deployment complete!"

            