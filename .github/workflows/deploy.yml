name: Deploy Changed Services

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the previous commit so git diff is always accurate

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
          MOCK_SERVER_ENV: ${{ secrets.MOCK_SERVER_ENV }}
          TELEMETRY_ENV: ${{ secrets.TELEMETRY_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SERVER_ENV,CLIENT_ENV,MOCK_SERVER_ENV,TELEMETRY_ENV
          script: |
            set -e
            set -o pipefail
            cd /home/ubuntu

            # -----------------------------------------------------------
            # 1. CLONE / SELF-HEAL REPOSITORY
            # -----------------------------------------------------------
            CLONED=false
            if [ ! -d "mockAPI/.git" ]; then
              echo "📦 Self-healing: mockAPI directory missing. Performing fresh clone..."
              rm -rf mockAPI
              git clone https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adityaboxi/mockAPI.git mockAPI
              CLONED=true
            fi

            cd mockAPI
            git fetch origin main --depth=2
            git reset --hard origin/main

            # -----------------------------------------------------------
            # 2. WRITE .env FILES FROM ACTION SECRETS
            # -----------------------------------------------------------
            printf '%s\n' "$SERVER_ENV" > server/.env
            printf '%s\n' "$CLIENT_ENV" > client/.env
            printf '%s\n' "$MOCK_SERVER_ENV" > mock-server/.env

            mkdir -p telemetry-server
            if [ -n "$TELEMETRY_ENV" ]; then
              printf '%s\n' "$TELEMETRY_ENV" > telemetry-server/.env
            else
              printf "PORT=3003\nSESSION_SECRET=your-strong-secret\nREDIS_URL=redis://redis:6378\nDASHBOARD_USER=admin\nDASHBOARD_PASS=password\nCLIENT_ORIGIN=https://opentelemetry.client.mockapi.info\nNODE_ENV=production\nVITE_API_BASE_URL=/api\nVITE_WS_URL=/api\n" > telemetry-server/.env
            fi

            # -----------------------------------------------------------
            # 3. SELECTIVE MICROSERVICE DETECTION
            # -----------------------------------------------------------
            DEPLOY_SERVER=false
            DEPLOY_MOCK=false
            DEPLOY_CLIENT=false
            DEPLOY_DOMAIN=false
            DEPLOY_TELEMETRY=false

            folder_exists() {
              [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]
            }

            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$CLONED" == "true" ]; then
              echo "🔄 Manual dispatch or fresh clone detected - deploying all services."
              folder_exists "telemetry-server" && DEPLOY_TELEMETRY=true
              folder_exists "server" && DEPLOY_SERVER=true
              folder_exists "mock-server" && DEPLOY_MOCK=true
              folder_exists "client" && DEPLOY_CLIENT=true
              folder_exists "domainservice" && DEPLOY_DOMAIN=true
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only --diff-filter=A HEAD)
              echo "🔍 Changed files in this commit:"
              echo "$CHANGED_FILES"

              # Global configs triggers full stack deployment
              if echo "$CHANGED_FILES" | grep -qE "(^deploy\.sh|^package\.json|^\.github/)"; then
                echo "🚀 Core infrastructure modified - rebuilding full stack."
                folder_exists "telemetry-server" && DEPLOY_TELEMETRY=true
                folder_exists "server" && DEPLOY_SERVER=true
                folder_exists "mock-server" && DEPLOY_MOCK=true
                folder_exists "client" && DEPLOY_CLIENT=true
                folder_exists "domainservice" && DEPLOY_DOMAIN=true
              else
                # Microservice-specific deployment
                if folder_exists "server" && echo "$CHANGED_FILES" | grep -q "^server/"; then
                  echo "📦 Server changes detected."
                  DEPLOY_SERVER=true
                fi
                if folder_exists "client" && echo "$CHANGED_FILES" | grep -q "^client/"; then
                  echo "📦 Client changes detected."
                  DEPLOY_CLIENT=true
                fi
                if folder_exists "mock-server" && echo "$CHANGED_FILES" | grep -q "^mock-server/"; then
                  echo "📦 Mock-server changes detected."
                  DEPLOY_MOCK=true
                fi
                if folder_exists "telemetry-server" && echo "$CHANGED_FILES" | grep -q "^telemetry-server/"; then
                  echo "📦 Telemetry changes detected."
                  DEPLOY_TELEMETRY=true
                fi
                if folder_exists "domainservice" && echo "$CHANGED_FILES" | grep -q "^domainservice/"; then
                  echo "📦 Domain proxy changes detected."
                  DEPLOY_DOMAIN=true
                fi
              fi
            fi

            # Skip if no microservice changed
            if [ "$DEPLOY_SERVER" = false ] && [ "$DEPLOY_MOCK" = false ] && [ "$DEPLOY_CLIENT" = false ] && [ "$DEPLOY_DOMAIN" = false ] && [ "$DEPLOY_TELEMETRY" = false ]; then
              echo "ℹ️ No microservices changed. Skipping deployment."
              exit 0
            fi

            export DEPLOY_SERVER DEPLOY_MOCK DEPLOY_CLIENT DEPLOY_DOMAIN DEPLOY_TELEMETRY

            # -----------------------------------------------------------
            # 4. RESTORE DOCKER NETWORKS
            # -----------------------------------------------------------
            docker network create orch-net 2>/dev/null || true
            docker network create shared-net 2>/dev/null || true

            # -----------------------------------------------------------
            # 5. EXECUTE DEPLOYMENT WITH RETRIES
            # -----------------------------------------------------------
            chmod +x deploy.sh
            echo "🚀 Deploying active services: SERVER=$DEPLOY_SERVER MOCK=$DEPLOY_MOCK CLIENT=$DEPLOY_CLIENT DOMAIN=$DEPLOY_DOMAIN TELEMETRY=$DEPLOY_TELEMETRY"

            MAX_RETRIES=3
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_RETRIES ]; do
              echo "▶️ Deployment attempt $ATTEMPT of $MAX_RETRIES..."
              if ./deploy.sh; then
                echo "✅ Deployment succeeded on attempt $ATTEMPT."
                break
              else
                echo "❌ Deployment attempt $ATTEMPT failed."
                if [ $ATTEMPT -eq $MAX_RETRIES ]; then
                  echo "❌ All retries exhausted. Deployment failed."
                  exit 1
                fi
                echo "⏳ Retrying in 5 seconds..."
                sleep 5
                ATTEMPT=$((ATTEMPT + 1))
              fi
            done

            # -----------------------------------------------------------
            # 6. POST-DEPLOYMENT CLEANUP
            # -----------------------------------------------------------
            docker image prune -f --filter "dangling=true" 2>/dev/null || true
            echo "✅ Deployment and health checks completed successfully."