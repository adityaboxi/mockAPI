services:
  redis:
    image: redis:7-alpine
    container_name: telemetry-redis
    restart: unless-stopped
    env_file: ../.env      
    command: redis-server --port 6378
    # No host ports exposed – internal only
    networks:
      - shared-net
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: telemetry-server
    restart: unless-stopped
    env_file: ../.env                         # All environment variables come from root .env
    # No 'environment' block – everything is read from .env
    ports:
      - "${PORT:-3003}:3003"
    depends_on:
      - redis
    networks:
      - shared-net

  client:
    build:
      context: ./client
      args:
        # These build-time variables are read from the root .env
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: telemetry-client
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - server
    networks:
      - shared-net
    environment:
      - NODE_ENV=${NODE_ENV:-production}   # Optional, runtime env for container

networks:
  shared-net:
    external: true

volumes:
  redis_data: