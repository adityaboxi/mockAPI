version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: telemetry-redis
    restart: unless-stopped
    networks:
      - shared-net
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: telemetry-server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PORT=3003
      - SESSION_SECRET=${SESSION_SECRET:-change-me}
      - REDIS_URL=redis://telemetry-redis:6379
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-password}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://api.mockapi.info}
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3003:3003"   # API & WebSocket (only if needed externally)
    depends_on:
      - redis
    networks:
      - shared-net

  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.mockapi.info/telemetry}
        - VITE_WS_URL=${VITE_WS_URL:-wss://api.mockapi.info/telemetry}
    container_name: telemetry-client
    restart: unless-stopped
    # ⚠️ No ports exposed to the host – only accessible via nginx reverse proxy
    # ports:
    #   - "5173:80"   # ← comment this out in production
    depends_on:
      - server
    networks:
      - shared-net
    environment:
      - NODE_ENV=${NODE_ENV:-production}

networks:
  shared-net:
    external: true

volumes:
  redis_data: