version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: telemetry-redis
    restart: unless-stopped
    networks:
      - shared-net
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: telemetry-server
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3003}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-password}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${PORT:-3003}:3003"   # Expose for external monitoring if needed
    depends_on:
      - redis
    networks:
      - shared-net

  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: telemetry-client
    restart: unless-stopped
    # No host ports exposed – only accessed via domain service
    depends_on:
      - server
    networks:
      - shared-net
    environment:
      - NODE_ENV=${NODE_ENV:-production}

networks:
  shared-net:
    external: true

volumes:
  redis_data:


  