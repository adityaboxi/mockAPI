services:
  redis:
    image: redis:7-alpine
    container_name: telemetry-redis
    restart: unless-stopped  
    command: redis-server --port 6378
    networks:
      - shared-net
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: telemetry-server
    restart: unless-stopped
    env_file: ./.env                         # Only server needs runtime env
    ports:
      - "${PORT:-3003}:3003"
    depends_on:
      - redis
    networks:
      - shared-net

  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: telemetry-client
    restart: unless-stopped
    # No env_file – client doesn't need runtime environment variables
    ports:
      - "8083:80"
    depends_on:
      - server
    networks:
      - shared-net

networks:
  shared-net:
    external: true

volumes:
  redis_data: