<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { background: #1e1e2e; color: #cdd6f4; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #11111b; padding: 40px; border-radius: 12px; border: 1px solid #45475a; width: 320px; }
    h2 { color: #89b4fa; margin-top: 0; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; }
    button { width: 100%; padding: 10px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .error { color: #f38ba8; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔐 Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <div id="error" class="error"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = data.redirect || '/';
        } else {
          document.getElementById('error').textContent = data.error || 'Login failed';
        }
      } catch {
        document.getElementById('error').textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
