<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MockAPI · Login</title>
  <style>
    /* ─── Reset & Base ─── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f0e17;
      background-image: radial-gradient(circle at 20% 30%, rgba(137, 180, 250, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(243, 139, 168, 0.06) 0%, transparent 50%);
      padding: 1rem;
    }

    /* ─── Animated background glow ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(137, 180, 250, 0.12), transparent 70%),
                  radial-gradient(ellipse at 70% 80%, rgba(243, 139, 168, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Card ─── */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(17, 17, 27, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(69, 71, 90, 0.6);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      transition: transform 0.2s ease;
    }

    .login-card:hover {
      transform: translateY(-2px);
    }

    /* ─── Brand ─── */
    .brand {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .brand .icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 0.3rem;
    }

    .brand h1 {
      color: #cdd6f4;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: #89b4fa;
    }

    .brand p {
      color: #6c7086;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    /* ─── Form ─── */
    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      color: #a6adc8;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(49, 50, 68, 0.7);
      border: 1px solid #45475a;
      border-radius: 12px;
      color: #cdd6f4;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-wrap input:focus {
      border-color: #89b4fa;
      box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.2);
    }

    .input-wrap input::placeholder {
      color: #6c7086;
      font-weight: 400;
    }

    .input-wrap .input-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6c7086;
      pointer-events: none;
      font-size: 1.1rem;
    }

    /* ─── Options ─── */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0 1.5rem;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #a6adc8;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .form-options label input[type="checkbox"] {
      accent-color: #89b4fa;
      width: 1rem;
      height: 1rem;
    }

    .form-options a {
      color: #89b4fa;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .form-options a:hover {
      color: #b4cdfa;
      text-decoration: underline;
    }

    /* ─── Submit button ─── */
    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background: #89b4fa;
      border: none;
      border-radius: 12px;
      color: #1e1e2e;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      background: #7aa9f0;
      box-shadow: 0 4px 16px rgba(137, 180, 250, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ─── Loading spinner ─── */
    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Error message ─── */
    .error-msg {
      color: #f38ba8;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.4rem;
      text-align: center;
      transition: opacity 0.3s;
    }

    /* ─── Signup link ─── */
    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #6c7086;
      font-size: 0.9rem;
    }

    .signup-link a {
      color: #89b4fa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .signup-link a:hover {
      color: #b4cdfa;
      text-decoration: underline;
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .login-card {
        padding: 1.8rem 1.2rem;
      }
      .brand h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <span class="icon">🚀</span>
    <h1>Mock<span>API</span></h1>
    <p>Sign in to your workspace</p>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="Enter your username" required autofocus />
        <span class="input-icon">👤</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password" required />
        <span class="input-icon">🔒</span>
      </div>
    </div>

    <div class="form-options">
      <label>
        <input type="checkbox" id="remember" />
        Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn-submit" id="loginBtn">
      <span id="btnText">Sign In</span>
    </button>

    <div id="error" class="error-msg"></div>
  </form>

  <div class="signup-link">
    Don't have an account? <a href="/signup">Create one</a>
  </div>
</div>

<script>
  (function() {
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const errorDiv = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset error
      errorDiv.textContent = '';

      // Basic validation
      const user = username.value.trim();
      const pass = password.value.trim();
      if (!user || !pass) {
        errorDiv.textContent = 'Please fill in both fields.';
        return;
      }

      // Show loading state
      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Signing in…';

      try {
        const res = await fetch('login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Redirect to the dashboard (or the provided redirect)
          window.location.href = data.redirect || '/';
          return;
        } else {
          errorDiv.textContent = data.error || 'Invalid credentials. Please try again.';
        }
      } catch (err) {
        errorDiv.textContent = 'Network error. Please check your connection.';
      } finally {
        loginBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });

    // Clear error on typing
    username.addEventListener('input', () => errorDiv.textContent = '');
    password.addEventListener('input', () => errorDiv.textContent = '');
  })();
</script>

</body>
</html>
