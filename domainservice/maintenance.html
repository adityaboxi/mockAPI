<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Temporarily Unavailable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.06);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .retry-btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-weight: 500;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .retry-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="emoji">🔧</span>
        <h1>We'll be right back</h1>
        <p>
            Our service is currently undergoing a brief maintenance.
            Everything should be back to normal in just a moment.
            Thank you for your patience!
        </p>
        <button class="retry-btn" onclick="location.reload()">Try Again</button>
        <div class="footer-note">If the problem persists, please contact support.</div>
    </div>
</body>
</html>
