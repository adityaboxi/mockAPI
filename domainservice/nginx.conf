    }
}

# ==================== Server Subdomain (HTTPS) ====================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.mockapi.info;

    ssl_certificate /etc/letsencrypt/live/api.mockapi.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mockapi.info/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://host.docker.internal:8081;  # or 4000 for healthcheck
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

