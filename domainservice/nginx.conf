# ==================== DEFAULT CATCH‑ALL (no domain matched) ====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;  # silently drop invalid requests
}

# ==================== REDIRECT HTTP -> HTTPS ====================
server {
    listen 80;
    listen [::]:80;
    server_name api.mockapi.info client.mockapi.info server.mockapi.info;
    return 301 https://$host$request_uri;
}

# ==================== API Subdomain (HTTPS) ====================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mockapi.info;

    # SSL certificates (the same cert covers all three domains)
    ssl_certificate /etc/letsencrypt/live/api.mockapi.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mockapi.info/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==================== Client Subdomain (HTTPS) ====================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name client.mockapi.info;

    ssl_certificate /etc/letsencrypt/live/api.mockapi.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mockapi.info/privkey.pem;

