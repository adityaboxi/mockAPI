<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Maintenance – MockAPI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1e1e24;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      text-align: center;
      padding: 40px 30px;
      background: linear-gradient(145deg, #2a2a32, #1e1e24);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 12px;
    }
    p {
      color: #9ba3c4;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .emoji-large {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
    }
    .footer {
      margin-top: 28px;
      color: #3f4666;
      font-size: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">MockAPI</span>
    <span class="emoji-large">⚙️</span>
    <h1>API Service Unavailable</h1>
    <p>The mock server is currently undergoing maintenance or experiencing issues.</p>
    <p style="color:#7a85a8; font-size:14px;">Please try again in a few minutes.</p>
    <div class="footer">&copy; 2026 MockAPI · Secured with ❤️</div>
  </div>
</body>
</html>
